</style></head><body><div id="stage"><div id="cam">

<script>
window.LEGAL='Crédito sujeto a estudio y aprobación. Inicial $99.000 + 16 cuotas semanales de $60.000 u 8 quincenales de $120.000. Total $1.059.000.';
window.HI=/^(Redmi|Motorola|1|2|\$|128|8|50|dos|WhatsApp)/i;
</script>
<script src="../../motor/base.js"></script>
<script>
window.LEGAL_WIN=[K('inicial')-.2,LE(3)+.3];
// burbujas de comentarios
const BUB=[['1 🔥',0],['2 💙',1],['1!!',0],['el 2 😍',1],['1 ❤️',0],['2 🙌',1],['uno 🔥',0],['2',1],['1 😍',0],['2 💯',1]];
BUB.forEach((b,i)=>{const d=document.createElement('div');d.className='bub';d.textContent=b[0];$('bubs').appendChild(d);b.el=d;});
const specPos={s1:[60,900],s2:[60,1020],s3:[60,780],s4:[600,780],s5:[640,900],s6:[600,1020]};
Object.entries(specPos).forEach(([id,[x,y]])=>{$(id).style.left=x+'px';$(id).style.top=y+'px';});
window.scene=function(t){
  const tC=K('cual'),tR=K('redmi'),tM=K('moto'),tR2=K('r2'),tM2=K('m2'),tI=K('inicial'),t1=K('uno'),t2=K('dos'),tW=K('wa');
  $('cam').style.transform=`scale(${1.08-.08*ease(t/1)+punch(t,tC,.06)})`;
  flash(t,tC,.6);
  // reparto de pantalla: 0.5 normal, foco izquierda en L1, derecha en L2
  const fL=easeIO((t-(tR2-.3))/.4)*(1-easeIO((t-(tM2-.3))/.4));
  const fR=easeIO((t-(tM2-.3))/.4)*(1-easeIO((t-(LS(3)-.3))/.4));
  const split=540+fL*220-fR*220;
  const open=ease((t-.05)/.6);
  $('L').style.width=split+'px'; $('R').style.width=(1080-split)+'px';
  $('L').style.transform=`translateY(${(1-open)*-1920}px)`; $('R').style.transform=`translateY(${(1-open)*1920}px)`;
  document.querySelector('#L .name').style.transform=`scale(${Math.min(1,split/540)})`;document.querySelector('#R .name').style.transform=`scale(${Math.min(1,(1080-split)/540)})`;
  // celulares
  const ri=$('ri'),mi=$('mi');
  const b=Math.sin(t*2)*10;
  const eR=ease((t-tR+.15)/.4), eM=ease((t-tM+.15)/.4);
  const low=easeIO((t-(tI-.3))/.4)*(1-easeIO((t-(LS(4)-.2))/.4));
  ri.style.left=(split/2-122)+'px'; mi.style.left=((1080-split)/2-153)+'px';
  ri.style.transform=`translateY(${b+(1-open)*400-low*120}px) scale(${(.92+eR*.08+fL*.08)*(1-low*.25)}) rotate(${-4+Math.sin(t*1.2)*2}deg)`;
  mi.style.transform=`translateY(${-b+(1-open)*400-low*120}px) scale(${(.92+eM*.08+fR*.08)*(1-low*.25)}) rotate(${4+Math.sin(t*1.2+1)*2}deg)`;
  // VS + rayo
  { const vs=$('vs'),p=(t-tC+.1)/.35; const hide=clamp(fL+fR)+low+clamp((t-(t1-.4))/.3);
    vs.style.opacity=clamp(p*3)*(1-clamp(hide*2)); vs.style.left=(split)+'px';
    vs.style.transform=`scale(${t<tC-.1?2.5:Math.max(1,2.5-1.5*ease(p))*(1+.05*Math.sin(t*8))}) rotate(${Math.sin(t*3)*6}deg)`;
    $('bolt').style.left=split+'px'; $('bolt').style.opacity=(t>tC-.1?(.6+.4*Math.sin(t*25)):0)*(1-clamp(hide*2));
    $('bp').setAttribute('d',`M30 0 ${[...Array(8)].map((_,i)=>`L${30+((i%2?1:-1)*(14+6*Math.sin(t*20+i)))} ${(i+1)*240}`).join(' ')}`); }
  // specs
  [['s3','r2'],['s1','r128'],['s2','r8']].forEach(([id,k])=>show($(id),t,K(k)-.05,tM2-.35,.35,30,.4));
  [['s4','m50'],['s5','m128'],['s6','m8']].forEach(([id,k])=>show($(id),t,K(k)-.05,LS(3)-.3,.35,30,.4));
  show($('price'),t,tI-.1,LS(4)-.15,.45,100,.5);
  show($('n1'),t,t1-.05,tW-.3,.35,0,.2); show($('n2'),t,t2-.05,tW-.3,.35,0,.2);
  ['n1','n2'].forEach((id,i)=>{ if(t>[t1,t2][i]+.35&&t<tW-.3) $(id).style.transform+=` scale(${1+.05*Math.sin(t*8+i)})`; });
  // burbujas subiendo
  BUB.forEach((bb,i)=>{const st=t1+.2+i*.32, p=(t-st)/2.2; const el=bb.el;
    el.style.opacity=p>0&&p<1&&t<tW-.1?Math.min(1,p*6,(1-p)*3):0;
    const x=bb[1]? 640+((i*53)%200):90+((i*71)%200);
    el.style.transform=`translate(${x+Math.sin(p*6+i)*20}px,${1350-p*900}px)`;});
  { pop($('wa'),t,tW-.1,.5,140,.5); if(t>tW+.4) $('wa').style.transform+=` scale(${1+.04*Math.sin((t-tW)*7)})`; }
};
render(0);
</script></body></html>
